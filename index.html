    <meta charset="UTF-8" />
    <script>
      // Ensure window.fetch has both a getter and a setter so preview wrappers/extensions can safely reassign it
      (function() {
        try {
          var _rawFetch = window.fetch;
          var _currentFetch = _rawFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _currentFetch;
            },
            set: function(fn) {
              _currentFetch = fn;
            },
            configurable: true,
            enumerable: true,
          });
        } catch (e) {
          try {
            var proto = Object.getPrototypeOf(window);
            if (proto && Object.getOwnPropertyDescriptor(proto, 'fetch')) {
              var _protoFetch = proto.fetch;
              Object.defineProperty(proto, 'fetch', {
                get: function() {
                  return _currentFetch || _protoFetch;
                },
                set: function(fn) {
                  _currentFetch = fn;
                },
                configurable: true,
                enumerable: true,
              });
            }
          } catch (e2) {}
        }
      })();
    </script>
